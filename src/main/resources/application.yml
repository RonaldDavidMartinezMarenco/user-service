server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/user_db}
    username: ${SPRING_DATASOURCE_USERNAME:foodcourt}
    password: ${SPRING_DATASOURCE_PASSWORD:foodcourt}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

foodcourt:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl: ${JWT_TTL:PT8H}
  bootstrap:
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME}
    admin-identity-document: ${BOOTSTRAP_ADMIN_IDENTITY_DOCUMENT}
    admin-phone: ${BOOTSTRAP_ADMIN_PHONE}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
